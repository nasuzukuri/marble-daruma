<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マーブル達磨 AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: camera stage fills the screen above one docked control sheet; title chip floats top-left. Single dark look (camera UI). */
:root{
  --ink:#16121a;
  --sheet:rgba(28,22,32,.9);
  --paper:#f6eef2;
  --muted:#b9a9b6;
  --coral:#ff6f7d;
  --lilac:#cdb7d8;
  --line:rgba(246,238,242,.16);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#frame{position:absolute;pointer-events:none;overflow:visible;transition:opacity .5s}
#frame .outline{fill:none;stroke:var(--lilac);stroke-width:1.2;stroke-dasharray:3 2.2;vector-effect:non-scaling-stroke}
#frame .prog{fill:none;stroke:var(--coral);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
#frame .face{fill:none;stroke:var(--lilac);stroke-width:1;stroke-dasharray:2 3;opacity:.5;vector-effect:non-scaling-stroke}
#frame .eye{fill:var(--lilac);opacity:.45}
#frame.hide{opacity:0}

.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;pointer-events:none}
.brand{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:7px 14px;display:flex;gap:8px;align-items:baseline;backdrop-filter:blur(8px)}
.brand b{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.06em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.12em}
#hint{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);text-align:center;font-size:13px;line-height:1.5;color:var(--paper);text-shadow:0 1px 6px rgba(0,0,0,.75);pointer-events:none;text-wrap:balance;transition:opacity .4s}

.sheet{position:relative;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--sheet);border-top:1px solid var(--line)}
.panel{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.src{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.src button,.src label{font:500 12px/1 var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;letter-spacing:.04em}
.src [aria-pressed="true"]{color:var(--paper);border-color:var(--lilac);background:rgba(205,183,216,.12)}
.src input{position:absolute;width:1px;height:1px;opacity:0}
.src label:focus-within{outline:2px solid var(--coral);outline-offset:2px}
.main{font:700 16px/1 var(--f-body);letter-spacing:.12em;color:var(--ink);background:var(--coral);border:0;border-radius:14px;padding:15px;cursor:pointer}
.main.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;font-size:12px;color:var(--muted)}
.row input{width:100%;accent-color:var(--coral)}
.chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips .lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-right:4px}
.chip{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);cursor:pointer;padding:0}
.chip[aria-pressed="true"]{border-color:var(--paper);transform:scale(1.08)}
.tip{font-size:12px;color:var(--muted);text-align:center}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
#shot{position:absolute;inset:0;background:rgba(14,10,16,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.shot-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
#shotImg{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.close{font:500 13px/1 var(--f-body);color:var(--muted);background:none;border:0;padding:8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#frame,#hint{transition:none}}
</style>
</head>

const $=id=>document.getElementById(id);
const stage=$("stage"),cv=$("gl"),svg=$("frame"),hint=$("hint"),prog=$("prog"),size=$("size");

const GLOPT={antialias:false,premultipliedAlpha:false};
const gl=cv.getContext("webgl2",GLOPT)||cv.getContext("webgl",GLOPT);
const GL2=typeof WebGL2RenderingContext!=="undefined"&&gl instanceof WebGL2RenderingContext;

/* ---------- shaders ---------- */
const VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
const NOISE=`float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}`;
const TONE="vec3 tone(vec3 x){return mix(x,.7+.3*(1.-exp(-(x-.7)/.3)),step(.7,x));}";
const FS_SRC=`precision highp float;
uniform sampler2D uSrc,uMask;uniform vec2 uRes;uniform float uSrcA,uT,uAmp,uMelt,uFill;uniform vec3 uGain;uniform vec4 uF0,uF;uniform vec3 uBg;
${NOISE}
vec2 cover(vec2 uv){float ca=uRes.x/uRes.y;if(uSrcA>ca)uv.x=(uv.x-.5)*ca/uSrcA+.5;else uv.y=(uv.y-.5)*uSrcA/ca+.5;return uv;}
${TONE}
const vec2 FC=vec2(.51,.455),FR=vec2(.41,.19);
void main(){
 vec2 uv=vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y);
 vec2 local=(uv-uF.xy)/uF.zw;
 vec2 e=(local-FC)/(FR*1.18);float d=length(e);
 vec2 local2=local;float bl=0.;
 if(uMelt>0.&&d<1.){
  // face melts: fill it with the marble just above and just below, blended softly
  float yb=sqrt(max(1.-e.x*e.x,0.));
  float nz=(fbm(local*vec2(4.,8.)+3.1)-.5)*.5*(1.-d);
  vec2 up=FC+vec2(e.x,-yb-(yb+e.y)*.5+nz)*FR*1.18, dn=FC+vec2(e.x,yb+(yb-e.y)*.8+nz)*FR*1.18;

 }
 float wy=smoothstep(-.6,.6,e.y+(fbm(local*6.)-.5)*.8);
 vec2 q=uF0.xy+local*uF0.zw,q2=uF0.xy+local2*uF0.zw;
 float m=texture2D(uMask,q).r;
 float w=m*mix(smoothstep(.75,.95,d),1.,uMelt);
 vec2 off=vec2(0.);
 if(w>.001&&uAmp>0.){
  vec2 p=local*vec2(.81,1.)*2.6;float t=uT;
  vec2 a=vec2(fbm(p+vec2(0.,t*.15)),fbm(p+vec2(5.2,1.3)-t*.12));
  vec2 r=vec2(fbm(p+3.*a+vec2(1.7,9.2)+t*.1),fbm(p+3.*a+vec2(8.3,2.8)-t*.08));
  off=(r-.5)*3.5*uAmp;
  off.x+=sin(local.y*7.+t*1.3+a.x*6.)*uAmp*1.3;
  off.y+=sin(local.x*5.-t*.9+a.y*5.)*uAmp*.45;
  off*=w*uF0.zw;
  for(int k=0;k<4;k++){if(texture2D(uMask,q+off).r<.85)off*=.5;}
 }
 vec3 col=texture2D(uSrc,clamp(cover(q+off),0.,1.)).rgb;
 if(bl>0.)col=mix(col,texture2D(uSrc,clamp(cover(q2+off),0.,1.)).rgb,wy);
 col=tone(col*mix(vec3(1.),uGain,uFill));
 float outside=1.-smoothstep(.0,.06,texture2D(uMask,q+off).r);
 col*=mix(1.,.35,uFill*outside);

}`;
const FS_OP=`precision highp float;
uniform sampler2D uDye,uMask;uniform vec2 uRes,uA,uB;uniform float uAsp,uType,uR0,uR1,uLam;uniform vec3 uInk;
vec3 dye(vec2 p){vec2 uv=p/vec2(uAsp,1.);return texture2D(uDye,vec2(uv.x,1.-uv.y)).rgb;}
float msk(vec2 p){return texture2D(uMask,p/vec2(uAsp,1.)).r;}
void main(){
 vec2 uv=vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y);
 vec2 p=uv*vec2(uAsp,1.);vec3 col;
 if(uType<.5){
  vec2 d=p-uA;float dd=max(dot(d,d),1e-8);float dl=uR1*uR1-uR0*uR0;
  vec2 s=uA+d*sqrt(max(dd-dl,0.)/dd);if(msk(s)<.2)s=p;
  vec3 pushed=dye(s);
  float px=1.5/uRes.y;
  col=mix(uInk,pushed,smoothstep(-px,px,sqrt(dd)-sqrt(max(dl,0.))));
 }else{
  vec2 ab=uB-uA;float len=length(ab);vec2 dir=ab/max(len,1e-5);vec2 ap=p-uA;
  float t=clamp(dot(ap,dir),0.,len);float dist=length(ap-dir*t);
  vec2 s=p-ab*exp(-dist/uLam);if(msk(s)<.2)s=p;

const FS_SHOW=`precision highp float;
uniform sampler2D uDye,uCap,uMask;uniform vec2 uRes;uniform float uT,uAmb,uSrcA,uWhite;uniform vec4 uF,uF0;uniform vec3 uGain;
${NOISE}
${TONE}
vec2 cover(vec2 uv){float ca=uRes.x/uRes.y;if(uSrcA>ca)uv.x=(uv.x-.5)*ca/uSrcA+.5;else uv.y=(uv.y-.5)*uSrcA/ca+.5;return uv;}
const vec2 FC=vec2(.51,.455),FR=vec2(.41,.19);
vec3 dyeAt(vec2 uv){return texture2D(uDye,vec2(uv.x,1.-uv.y)).rgb;}
void main(){
 vec2 uv=vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y);
 vec2 local=(uv-uF.xy)/uF.zw;vec2 q=uF0.xy+local*uF0.zw;

  vec2 a=vec2(fbm(p+vec2(0.,t*.15)),fbm(p+vec2(5.2,1.3)-t*.12));

 gl.uniform1f(u.uR0,r0);gl.uniform1f(u.uR1,r1);gl.uniform3f(u.uInk,...ink);gl.uniform1f(u.uLam,lam);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);cur=1-cur;}
function pass(name,dst,set){const {pr,u}=P[name];gl.useProgram(pr);gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f);gl.viewport(0,0,dst.w,dst.h);
 gl.uniform2f(u.uTexel,1/dst.w,1/dst.h);if(u.uMask){bindTex(1,tMask);gl.uniform1i(u.uMask,1);}if(u.uF)gl.uniform4f(u.uF,...FF);
 let unit=3;set((n,tx)=>{bindTex(unit,tx);gl.uniform1i(u[n],unit++);},u);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function swapV(){fl.v.reverse();}
function splatV(x,y,vx,vy){ // x,y screen 0-1 (top-down); v in sim texels/sec
 pass("spl",fl.v[1],(b,u)=>{b("uS",fl.v[0].t);gl.uniform2f(u.uP,x,1-y);gl.uniform3f(u.uCol,vx,-vy,0);gl.uniform1f(u.uR,.0012);gl.uniform1f(u.uAsp,W/H);});swapV();}
function fluidStep(dt){
 pass("curl",fl.c[0],b=>b("uV",fl.v[0].t));
 pass("vort",fl.v[1],(b,u)=>{b("uV",fl.v[0].t);b("uC",fl.c[0].t);gl.uniform1f(u.uCurl,5);gl.uniform1f(u.uDt,dt);});swapV();
 pass("div",fl.d[0],b=>b("uV",fl.v[0].t));
 pass("clr",fl.p[1],(b,u)=>{b("uP",fl.p[0].t);gl.uniform1f(u.uK,.8);});fl.p.reverse();
 for(let i=0;i<18;i++){pass("prs",fl.p[1],b=>{b("uP",fl.p[0].t);b("uD",fl.d[0].t);});fl.p.reverse();}
 pass("grad",fl.v[1],b=>{b("uP",fl.p[0].t);b("uV",fl.v[0].t);});swapV();
 pass("adv",fl.v[1],(b,u)=>{b("uV",fl.v[0].t);b("uS",fl.v[0].t);gl.uniform2f(u.uSimTexel,1/SW,1/SH);gl.uniform1f(u.uDt,dt);gl.uniform1f(u.uDiss,.35);gl.uniform1f(u.uObs,1);});swapV();
 const src=dye[cur],dst=dye[1-cur];
 pass("adv",dst,(b,u)=>{b("uV",fl.v[0].t);b("uS",src.t);gl.uniform2f(u.uSimTexel,1/SW,1/SH);gl.uniform1f(u.uDt,dt);gl.uniform1f(u.uDiss,0);gl.uniform1f(u.uObs,0);});cur=1-cur;}
function addDrop(x,y,R,ink){drops.push({c:[x,y],R,R0:0,t0:performance.now(),ink});}
function composite(white){const {pr,u}=P.show;gl.useProgram(pr);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);
 bindTex(2,dye[cur].t);gl.uniform1i(u.uDye,2);bindTex(0,tCap);gl.uniform1i(u.uCap,0);bindTex(1,tMask);gl.uniform1i(u.uMask,1);
 gl.uniform2f(u.uRes,cv.width,cv.height);gl.uniform1f(u.uT,t);gl.uniform1f(u.uAmb,Math.min(1,marbleT/1.5));gl.uniform1f(u.uWhite,white);
 gl.uniform1f(u.uSrcA,capA);gl.uniform4f(u.uF,...FF);gl.uniform4f(u.uF0,...F0);gl.uniform3f(u.uGain,...gain);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

/* ---------- pointer ---------- */
let drag=null,splats=[];
function asp(e){const r=stage.getBoundingClientRect();return[(e.clientX-r.left)/H,(e.clientY-r.top)/H];}
stage.addEventListener("pointerdown",e=>{stage.setPointerCapture(e.pointerId);
 drag={x:e.clientX,y:e.clientY,cx:frame.cx,cy:frame.cy,t:performance.now(),moved:0,lastP:asp(e)};});
stage.addEventListener("pointermove",e=>{if(!drag)return;
 drag.moved=Math.max(drag.moved,Math.hypot(e.clientX-drag.x,e.clientY-drag.y));
 if(state==="align"){frame.cx=drag.cx+e.clientX-drag.x;frame.cy=drag.cy+e.clientY-drag.y;layout();}
 else if(state==="marble"&&drag.moved>6){const p=asp(e);
  if(fl){const r=stage.getBoundingClientRect(),now=performance.now(),dtp=Math.max(8,now-(drag.lt||drag.t))/1000,k=1.15;
   splats.push([(e.clientX-r.left)/W,(e.clientY-r.top)/H,(p[0]-drag.lastP[0])*H/W*SW/dtp*k,(p[1]-drag.lastP[1])*SH/dtp*k]);drag.lt=now;}
  else combs.push([drag.lastP,p]);
  drag.lastP=p;}});
const hit=document.createElement("canvas").getContext("2d");
function onBody(e){const r=stage.getBoundingClientRect(),w=frame.h*RATIO,lx=(e.clientX-r.left-(frame.cx-w/2))/w,ly=(e.clientY-r.top-(frame.cy-frame.h/2))/frame.h;
 return hit.isPointInPath(PATH,lx*100,ly*100)&&Math.hypot((lx-.51)/.41,(ly-.455)/.19)>1.08;}
stage.addEventListener("pointerup",e=>{if(drag&&state==="marble"&&drag.moved<8&&performance.now()-drag.t<400&&onBody(e)){const p=asp(e);
  addDrop(p[0],p[1],.03+Math.random()*.035,palette[inkIdx]);inkIdx=(inkIdx+1)%palette.length;renderChips();}drag=null;});
stage.addEventListener("pointercancel",()=>drag=null);
addEventListener("resize",resize);

/* ---------- camera steadiness (auto open) ---------- */
const sc=document.createElement("canvas");sc.width=24;sc.height=30;const sx=sc.getContext("2d",{willReadFrequently:true});
let prev=null,steady=0,armed=false,lastCheck=0;
function checkSteady(now){if(now-lastCheck<120)return;const dt=(now-lastCheck)/1000;lastCheck=now;
 if(!(state==="align"&&mode==="cam"&&isVideo&&video.readyState>=2))return;
 const f=frameUV(),a=srcOfScreen(f[0],f[1]),b=srcOfScreen(f[0]+f[2],f[1]+f[3]),vw=video.videoWidth,vh=video.videoHeight;
 sx.drawImage(video,a[0]*vw,a[1]*vh,(b[0]-a[0])*vw,(b[1]-a[1])*vh,0,0,24,30);
 const d=sx.getImageData(0,0,24,30).data,g=new Float32Array(720);for(let i=0;i<720;i++)g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
 if(prev){let s=0;for(let i=0;i<720;i++)s+=Math.abs(g[i]-prev[i]);s/=720;
  if(s>14)armed=true;
  if(armed&&s<5)steady+=dt;else steady=0;}
 prev=g;const p=Math.min(1,steady/1.5);prog.setAttribute("stroke-dasharray",`${p*100} 100`);
 if(p>=1){steady=0;openDaruma();}}

/* ---------- loop ---------- */
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt*1.2;
 if(src){
  if(isVideo&&state==="align"&&video.readyState>=2)put(tSrc,video);
  if(dirtyMask)buildMask();checkSteady(now);
  if(state==="align")drawSrc(tSrc,srcA,frameUV(),frameUV(),0,0,0,null);
  else if(state==="zoom"){zt+=dt;const D=1.6,k=Math.min(1,zt/D),p=ease(k);
   const hh=F0[3]*Math.pow(FF[3]/F0[3],p),ww=hh*F0[2]/F0[3];
   const cx=F0[0]+F0[2]/2+(FF[0]+FF[2]/2-(F0[0]+F0[2]/2))*p,cy=F0[1]+F0[3]/2+(FF[1]+FF[3]/2-(F0[1]+F0[3]/2))*p;
   const f=[cx-ww/2,cy-hh/2,ww,hh];
   if(k>=1){drawSrc(tCap,capA,F0,FF,0,1,1,dye[cur]);
    frame={cx:(FF[0]+FF[2]/2)*W,cy:(FF[1]+FF[3]/2)*H,h:FF[3]*H};layout();buildMask();state="marble";marbleT=0;
    autoDrops=[[.3,.78],[.7,.84],[.5,.13]].map((l,i)=>({at:.4+i*.45,l,ink:palette[(1+i)%palette.length]}));
    flows=[{at:2.2,x0:.12,x1:.55,y:.8,vx:.9},{at:2.6,x0:.88,x1:.45,y:.15,vx:-.7}];
    if(fl){clearRT(fl.v[0]);clearRT(fl.p[0]);}}
   else drawSrc(tCap,capA,F0,f,0,0,p,null);}
  if(state==="marble"){marbleT+=dt;
   autoDrops=autoDrops.filter(a=>{if(marbleT<a.at)return true;const w=frame.h*RATIO;
    addDrop((frame.cx-w/2+a.l[0]*w)/H,(frame.cy-frame.h/2+a.l[1]*frame.h)/H,(.035+Math.random()*.02)*frame.h/H,a.ink);return false;});
   drops=drops.filter(d=>{const k=Math.min(1,(now-d.t0)/900),R1=d.R*(1-Math.pow(1-k,3));if(R1-d.R0>1e-4){opPass(0,d.c,d.c,d.R0,R1,d.ink,0);d.R0=R1;}return k<1;});
   combs.splice(0,24).forEach(s=>opPass(1,s[0],s[1],0,0,[0,0,0],.035));
   if(fl){flows=flows.filter(f=>{if(marbleT<f.at)return true;const w=frame.h*RATIO;
     for(let i=0;i<6;i++){const a=i/5;splatV((frame.cx-w/2+(f.x0+(f.x1-f.x0)*a)*w)/W,(frame.cy-frame.h/2+f.y*frame.h)/H,f.vx*SW,0);}return false;});
    splats.splice(0,40).forEach(s=>splatV(...s));fluidStep(Math.min(dt,1/30));}
   composite(0);}
 }
 requestAnimationFrame(loop);}
resize();say("「カメラを起動」を押して、カメラの使用を許可してください");requestAnimationFrame(loop);
})();
</script>
